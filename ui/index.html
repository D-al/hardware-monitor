<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硬件状态可视化监视器</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid rgba(100, 200, 255, 0.3);
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 2em;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-title {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #64c8ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #fff;
            text-align: center;
            margin: 10px 0;
        }
        
        .chart-container {
            width: 100%;
            height: 300px;
        }
        
        .core-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .core-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        
        .core-label {
            font-size: 0.8em;
            color: #aaa;
        }
        
        .core-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #4caf50;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .progress-fill {
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }
        
        /* GPU sub-panel styles */
        .gpu-subgrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .gpu-subpanel {
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 12px 8px;
        }
        
        .gpu-sublabel {
            font-size: 0.8em;
            color: #aaa;
            margin-bottom: 6px;
        }
        
        .vram-detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .vram-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: 10px;
            text-align: center;
        }
        
        .vram-item-label {
            font-size: 0.75em;
            color: #999;
            margin-bottom: 4px;
        }
        
        .vram-item-value {
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
        }
        
        .temp-warning { color: #ff9800 !important; }
        .temp-danger { color: #f44336 !important; }
        
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .gpu-subgrid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖥️ 硬件状态可视化监视器</h1>
        <p style="color: #aaa; margin-top: 10px;">实时监测 CPU · GPU · 内存 · 温度</p>
    </div>

    <div class="status-bar">
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span>实时更新中</span>
        </div>
        <div id="lastUpdate">最后更新: --</div>
    </div>

    <div class="dashboard-grid">
        <!-- CPU Cores -->
        <div class="card">
            <div class="card-title">
                <span>CPU 每核利用率</span>
                <span id="cpuAvg" style="font-size: 0.8em; color: #aaa;"></span>
            </div>
            <div class="core-grid" id="cpuCoreGrid"></div>
            <div class="chart-container" id="cpuChart"></div>
        </div>

        <!-- Memory -->
        <div class="card">
            <div class="card-title">内存占用</div>
            <div class="metric-value" id="memPercent">--%</div>
            <div style="text-align: center; color: #aaa; margin-bottom: 10px;" id="memDetail"></div>
            <div class="chart-container" id="memChart"></div>
        </div>

        <!-- Temperatures -->
        <div class="card">
            <div class="card-title">温度监控</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: center;">
                <div>
                    <div style="color: #aaa; margin-bottom: 5px;">CPU 温度</div>
                    <div class="metric-value temp-warning" id="tempCpu">--°C</div>
                </div>
                <div>
                    <div style="color: #aaa; margin-bottom: 5px;">GPU 温度</div>
                    <div class="metric-value temp-danger" id="tempGpu">--°C</div>
                </div>
            </div>
            <div class="chart-container" id="tempChart"></div>
        </div>

        <!-- GPU Utilization Sub-panels -->
        <div class="card">
            <div class="card-title">GPU 核心利用率</div>
            <div class="gpu-subgrid">
                <div class="gpu-subpanel">
                    <div class="gpu-sublabel">通用计算 (3D)</div>
                    <div class="metric-value" id="gpuUtilGeneral" style="font-size: 1.6em;">--%</div>
                </div>
                <div class="gpu-subpanel">
                    <div class="gpu-sublabel">视频解码器</div>
                    <div class="metric-value" id="gpuUtilDecoder" style="font-size: 1.6em; color: #4caf50;">--%</div>
                </div>
                <div class="gpu-subpanel">
                    <div class="gpu-sublabel">编码器 (Copy)</div>
                    <div class="metric-value" id="gpuUtilEncoder" style="font-size: 1.6em; color: #ff9800;">--%</div>
                </div>
            </div>
            <div class="chart-container" id="gpuUtilChart"></div>
        </div>

        <!-- Dedicated VRAM Usage -->
        <div class="card">
            <div class="card-title">专用显存占用</div>
            <div class="vram-detail-grid">
                <div class="vram-item">
                    <div class="vram-item-label">已使用</div>
                    <div class="vram-item-value" id="vramUsedMB">-- MB</div>
                </div>
                <div class="vram-item">
                    <div class="vram-item-label">可用</div>
                    <div class="vram-item-value" id="vramFreeMB">-- MB</div>
                </div>
                <div class="vram-item">
                    <div class="vram-item-label">保留</div>
                    <div class="vram-item-value" id="vramReservedMB">-- MB</div>
                </div>
                <div class="vram-item">
                    <div class="vram-item-label">总计</div>
                    <div class="vram-item-value" id="vramTotalMB">-- MB</div>
                </div>
            </div>
            <div style="text-align: center; margin-bottom: 15px;">
                <span style="color: #aaa; font-size: 0.9em;">使用率：</span>
                <span id="vramPercent" style="font-weight: bold; font-size: 1.2em;">--%</span>
            </div>
            <div class="chart-container" id="vramChart"></div>
        </div>
    </div>

    <script src="/ui/dashboard.js"></script>
</body>
</html>
